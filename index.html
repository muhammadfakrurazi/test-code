<div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm space-y-4">
  <h3 class="font-bold text-slate-900 text-base">Buka File Lokal (.txt / .csv)</h3>
  <div class="flex items-center gap-3">
    <input type="file" id="file-uploader" accept=".txt, .csv" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
  </div>
  <div class="mt-4">
    <h4 class="text-xs font-bold text-slate-700 mb-1">Isi File:</h4>
    <pre id="file-output-box" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 max-h-48 overflow-y-auto whitespace-pre-wrap">Belum ada file yang dibuka.</pre>
  </div>
</div>
